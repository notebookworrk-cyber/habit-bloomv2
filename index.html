<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#f0ecff"/>
<title>HabitBloom 🌸</title>
<!-- PERF: preconnect so DNS+TLS is ready before font request fires -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- PERF: load as print so it never blocks render; swaps to all once loaded -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" media="print" onload="this.media='all'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&display=swap"/></noscript>
<style>
/* ══════════════════════════════════════════════════════
   DESIGN SYSTEM — consolidated tokens, premium feel
   ══════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  /* Colors */
  --bg:#f8f6ff; --surface:#fff; --text:#3d3658; --muted:#9b93b8;
  --p:#d4c8f8;  --pl:#f0ecff;   --pd:#a98be8;   --pa:#7c5cbf;

  /* Border radius — 3 values only (was 8) */
  --r-sm:12px; --r-md:16px; --r-lg:24px;

  /* Elevation tokens — 5 levels (was 2) */
  --sh-0: none;
  --sh-1: 0 2px 8px rgba(120,90,200,.06);
  --sh-2: 0 4px 20px rgba(120,90,200,.10);
  --sh-3: 0 8px 32px rgba(120,90,200,.15);
  --sh-4: 0 20px 60px rgba(120,90,200,.20);

  /* Type scale — 6 sizes (was 16) */
  --text-xs:   11px;
  --text-sm:   13px;
  --text-base: 15px;
  --text-lg:   18px;
  --text-xl:   22px;
  --text-hero: 46px;

  /* Transitions */
  --t-fast:  .15s ease;
  --t-base:  .25s ease;
  --t-slow:  .4s  cubic-bezier(.34,1.56,.64,1);
}

html,body{height:100%;background:var(--bg);font-family:'Nunito',-apple-system,'Segoe UI',sans-serif;color:var(--text);overflow-x:hidden;}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;}
input,textarea,select{font-family:inherit;color:var(--text);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--p);border-radius:99px;}

/* ── ANIMATIONS ──────────────────────────────────────── */
@keyframes fadeUp       {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp      {from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes overlayIn    {from{background:rgba(50,40,80,0)}to{background:rgba(50,40,80,.35)}}
@keyframes flame        {0%,100%{transform:scaleY(1) rotate(-2deg)}50%{transform:scaleY(1.1) rotate(2deg)}}
@keyframes checkBounce  {0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes habitPop     {0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes focusPulse   {0%,100%{box-shadow:0 0 0 0 rgba(169,139,232,.3)}50%{box-shadow:0 0 0 14px rgba(169,139,232,0)}}
@keyframes timerFlip    {0%{opacity:1;transform:translateY(0)}45%{opacity:0;transform:translateY(-6px)}55%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes ringPop      {0%{transform:scale(.92)}100%{transform:scale(1)}}

/* FIX 7: CSS-only stagger — zero JS, zero layout thrash */
.fade-up{animation:fadeUp .35s ease both;}
.fade-up:nth-child(1) {animation-delay:0ms}   .fade-up:nth-child(2) {animation-delay:50ms}
.fade-up:nth-child(3) {animation-delay:100ms}  .fade-up:nth-child(4) {animation-delay:150ms}
.fade-up:nth-child(5) {animation-delay:200ms}  .fade-up:nth-child(6) {animation-delay:250ms}
.fade-up:nth-child(7) {animation-delay:300ms}  .fade-up:nth-child(8) {animation-delay:350ms}
.fade-up:nth-child(9) {animation-delay:400ms}  .fade-up:nth-child(10){animation-delay:450ms}
.fade-up:nth-child(11){animation-delay:500ms}  .fade-up:nth-child(12){animation-delay:550ms}

/* ── LAYOUT ──────────────────────────────────────────── */
#app{min-height:100vh;display:flex;flex-direction:column;}
#page{flex:1;max-width:480px;margin:0 auto;width:100%;padding:0 16px 96px;overflow-y:auto;}

/* ── BOTTOM NAV ──────────────────────────────────────── */
#nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.97);
  border-top:1.5px solid var(--p);
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 4px max(14px,env(safe-area-inset-bottom));
  z-index:100;
}
@supports (backdrop-filter:blur(1px)){
  @media (min-resolution:2dppx){
    #nav{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
  }
}
/* FIX U5: enhanced active state — icon lifts + indicator dot */
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 10px;border-radius:var(--r-sm);transition:all var(--t-base);min-width:50px;
  position:relative;
}
.nav-btn.active{background:var(--pl);}
.nav-btn .nav-icon{font-size:20px;line-height:1;transition:transform var(--t-base);}
.nav-btn.active .nav-icon{transform:translateY(-2px) scale(1.12);}
.nav-btn .nav-label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.2px;transition:color var(--t-base);}
.nav-btn.active .nav-label{color:var(--pa);font-weight:900;}
/* Active dot indicator */
.nav-btn.active::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--pa);margin:2px auto 0;}
#nav.locked .nav-btn{opacity:.3;pointer-events:none;}
/* FIX U4: active press state */
.nav-btn:active{transform:scale(.93);}

/* ── CARD ────────────────────────────────────────────── */
/* FIX U6: elevation tokens — cards use sh-1 (subtle), not same as modals */
.card{background:#fff;border:1.5px solid var(--p);border-radius:var(--r-lg);padding:18px 16px;box-shadow:var(--sh-1);margin-bottom:12px;}
.card:active{transform:scale(.995);}

/* ── FORM ────────────────────────────────────────────── */
.inp{width:100%;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--p);background:var(--pl);font-size:var(--text-sm);font-weight:600;outline:none;transition:border var(--t-base),box-shadow var(--t-base);margin-bottom:14px;display:block;}
.inp:focus{border-color:var(--pd);box-shadow:0 0 0 3px rgba(169,139,232,.12);}
/* FIX U12: placeholder contrast */
.inp::placeholder{color:var(--muted);opacity:.7;}
.inp:focus::placeholder{opacity:.35;}
.label{display:block;font-size:var(--text-xs);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}

/* ── BUTTONS ─────────────────────────────────────────── */
/* FIX U2+U4: consolidated radius + :active press states */
.btn-primary{width:100%;padding:14px;border-radius:var(--r-md);font-size:var(--text-base);font-weight:800;color:#fff;cursor:pointer;transition:all var(--t-base);border:none;}
.btn-primary:active{transform:scale(.97);opacity:.9;}
.btn-sm{padding:9px 18px;border-radius:var(--r-sm);font-size:var(--text-sm);font-weight:800;cursor:pointer;border:none;transition:all var(--t-base);}
.btn-sm:active{transform:scale(.95);}
.action-btn{flex:1;padding:13px 10px;border-radius:var(--r-md);font-weight:800;font-size:var(--text-xs);color:var(--text);box-shadow:var(--sh-1);transition:all var(--t-base);border:1.5px solid var(--p);background:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;}
.action-btn:active{transform:scale(.95);}
.action-btn.active{background:var(--pl);border-color:var(--pd);}
.quick-row{display:flex;gap:10px;margin-top:16px;margin-bottom:10px;}
.icon-btn{font-size:17px;padding:6px;border-radius:var(--r-sm);cursor:pointer;border:none;transition:all var(--t-base);}
.icon-btn:active{transform:scale(.88);}
.icon-btn-edit{background:var(--pl);}
.icon-btn-del{background:#fff5f5;}
.focus-btn{flex:1;padding:8px;border-radius:var(--r-sm);font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--pl),var(--p));border:1.5px solid var(--pd);color:var(--pa);transition:all var(--t-base);cursor:pointer;}
.focus-btn:active{transform:scale(.95);}
.del-btn{padding:8px 14px;border-radius:var(--r-sm);font-size:var(--text-sm);background:#fff5f5;border:1.5px solid #f8c8c8;color:#c84040;cursor:pointer;transition:all var(--t-base);}
.del-btn:active{transform:scale(.95);}
.ghost-btn{padding:6px 14px;border-radius:var(--r-sm);font-size:var(--text-xs);background:#f5f5f5;border:1.5px solid #eee;color:var(--muted);font-weight:700;cursor:pointer;transition:all var(--t-base);}
.ghost-btn:active{transform:scale(.95);}
.back-btn{flex:1;padding:13px;border-radius:var(--r-md);background:var(--pl);border:1.5px solid var(--p);font-weight:800;font-size:var(--text-base);cursor:pointer;transition:all var(--t-base);}
.back-btn:active{transform:scale(.97);}
.next-btn{flex:1;padding:13px;border-radius:var(--r-md);color:#fff;font-weight:800;font-size:var(--text-base);background:linear-gradient(135deg,var(--pd),var(--pa));border:none;cursor:pointer;transition:all var(--t-base);}
.next-btn:active{transform:scale(.97);opacity:.9;}

/* ── MODAL ───────────────────────────────────────────── */
/* FIX U11: overlay fades in sync with sheet slide */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(50,40,80,.35);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;
  animation:overlayIn .25s ease forwards;
}
/* FIX U9: will-change for smooth GPU compositing */
.modal-box{
  width:100%;max-width:480px;background:#fff;
  border-radius:28px 28px 0 0;padding:22px 18px 36px;
  box-shadow:var(--sh-3);animation:slideUp .3s ease forwards;
  max-height:88vh;overflow-y:auto;will-change:transform,opacity;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-title{font-weight:900;font-size:var(--text-lg);}
.modal-close{width:32px;height:32px;border-radius:var(--r-sm);background:var(--pl);font-size:15px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);cursor:pointer;border:none;transition:all var(--t-base);}
.modal-close:active{transform:scale(.88);}

/* ── HABIT CARD ──────────────────────────────────────── */
/* FIX U9: micro-celebration on done + check bounce */
.habit-card{
  background:#fff;border:1.5px solid var(--p);border-radius:var(--r-md);
  padding:14px 15px;margin-bottom:10px;display:flex;align-items:center;
  gap:12px;box-shadow:var(--sh-1);transition:all .3s ease;
}
.habit-card.done{background:var(--pl);border-color:var(--pd);}
.habit-card.just-done{animation:habitPop .3s ease;}
.habit-toggle{
  width:42px;height:42px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  border:2px solid var(--p);background:var(--pl);
  transition:all var(--t-base);cursor:pointer;
}
.habit-toggle:active{transform:scale(.88);}
.habit-toggle.done{background:var(--pd);border-color:var(--pa);animation:checkBounce .35s var(--t-slow);}
.habit-name{font-weight:800;font-size:var(--text-base);transition:color var(--t-base);}
.habit-name.done{color:var(--pa);}

/* ── BAR CHART ───────────────────────────────────────── */
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar-wrap{width:100%;border-radius:8px 8px 4px 4px;background:var(--pl);display:flex;align-items:flex-end;overflow:hidden;}
.bar-fill{width:100%;border-radius:8px 8px 4px 4px;transition:height .7s cubic-bezier(.4,0,.2,1);}

/* ── MISC COMPONENTS ─────────────────────────────────── */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.ring-label{position:absolute;font-weight:900;color:var(--text);}
.streak{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;color:#f07030;}
.flame{display:inline-block;animation:flame 1.1s ease-in-out infinite;will-change:transform;}
.badge{padding:10px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;transition:all var(--t-base);}
.badge.earned{background:var(--pl);border:1.5px solid var(--p);}
.badge.locked{background:#f5f5f5;border:1.5px solid #eee;opacity:.45;}
.prio{font-size:10px;font-weight:800;padding:3px 10px;border-radius:99px;}
.prio.High{background:#f8c8c8;color:#c84040;}
.prio.Medium{background:#f8e8b8;color:#c87820;}
.prio.Low{background:#c8f8e0;color:#2a9060;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sec-title{font-weight:900;font-size:var(--text-lg);}
/* FIX U10: section label for stats grouping */
.section-label{font-size:var(--text-xs);font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:16px 0 6px;}
/* FIX U8: distinctive quote card — editorial left-border style */
.quote-card{
  border-left:3px solid var(--pd);border-top:none;border-right:none;border-bottom:none;
  border-radius:0 var(--r-md) var(--r-md) 0;
  background:linear-gradient(135deg,var(--pl) 0%,rgba(255,255,255,0) 100%);
  padding:14px 18px;margin-bottom:16px;position:relative;overflow:hidden;
}
.quote-card::before{
  content:'"';position:absolute;top:-4px;left:10px;
  font-size:52px;color:var(--pd);opacity:.18;
  font-family:Georgia,serif;line-height:1;pointer-events:none;
}
.insight-chip{background:var(--pl);border:1.5px solid var(--p);border-radius:var(--r-md);padding:12px 14px;font-size:var(--text-sm);font-weight:700;color:var(--text);line-height:1.5;margin-bottom:10px;}
.insight-chip span{color:var(--pa);font-weight:800;}
.rc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--pl);}
.rc-row:last-child{border-bottom:none;}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.scroll-x::-webkit-scrollbar{display:none;}

/* ── PAGE LAYOUT ─────────────────────────────────────── */
.pg-head{padding:22px 0 6px;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.pg-title{font-family:'Playfair Display',Georgia,serif;font-size:var(--text-xl);color:var(--text);}

/* ── TIMER — no-blink display ────────────────────────── */
/* FIX U-TIMER: timer digits animate smoothly, not full-page blink */
#pom-time{
  font-size:var(--text-hero);font-weight:900;
  font-variant-numeric:tabular-nums;color:var(--text);
  display:block;line-height:1;
  transition:opacity .1s ease;
}
#pom-time.tick{animation:timerFlip .18s ease;}

/* ── THEME PICKER ────────────────────────────────────── */
.theme-chip{width:32px;height:32px;border-radius:50%;cursor:pointer;transition:all var(--t-base);border:3px solid transparent;}
.theme-chip.active{outline:3px solid currentColor;outline-offset:2px;}
.theme-chip:active{transform:scale(.88);}

/* ── SETUP ───────────────────────────────────────────── */
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--pl),#fff8ff,#f0ecff);}
.setup-card{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:28px 22px;box-shadow:var(--sh-3);animation:fadeUp .5s ease;}

/* ── FOCUS OVERLAY ───────────────────────────────────── */
#focus-lock-overlay{position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#f0ecff 0%,#fff8ff 50%,#f8f0ff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeUp .4s ease;}
.focus-ring-wrap{position:relative;margin-bottom:24px;}
.focus-ring-wrap svg{transform:rotate(-90deg);}
.focus-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.focus-task-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;text-align:center;color:var(--text);margin-bottom:6px;max-width:280px;line-height:1.3;}
.focus-exit-btn{padding:10px 22px;border-radius:var(--r-sm);font-size:var(--text-sm);font-weight:800;background:#fff5f5;border:1.5px solid #f8c8c8;color:#c84040;cursor:pointer;transition:all var(--t-base);}
.focus-exit-btn:active{transform:scale(.95);}

/* ── AUDIT POPUP ─────────────────────────────────────── */
#audit-popup{position:fixed;inset:0;z-index:450;background:rgba(50,40,80,.4);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:overlayIn .25s ease forwards;}
.audit-box{width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 40px;box-shadow:var(--sh-3);animation:slideUp .3s ease forwards;}
.audit-step{display:none;}
.audit-step.active{display:block;animation:fadeUp .3s ease;}

/* ── ENERGY TAGS ─────────────────────────────────────── */
.energy-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:var(--text-xs);font-weight:800;}
.energy-tag.low{background:#f8c8c8;color:#c84040;}
.energy-tag.medium{background:#f8e8b8;color:#c87820;}
.energy-tag.high{background:#c8f8e0;color:#2a9060;}

/* ── EMPTY STATE ─────────────────────────────────────── */
/* FIX U7: distinctive empty states */
.empty-state{text-align:center;padding:52px 20px;}
.empty-state-icon{font-size:52px;margin-bottom:14px;display:block;animation:ringPop .5s var(--t-slow);}
.empty-state-title{font-weight:900;font-size:var(--text-lg);color:var(--text);margin-bottom:8px;}
.empty-state-sub{font-size:var(--text-sm);color:var(--muted);font-weight:600;line-height:1.6;max-width:240px;margin:0 auto 22px;}

/* ══════════════════════════════════════════════
   CAT COMPANION SYSTEM
   ══════════════════════════════════════════════ */
#cat-companion {
  position: fixed;
  bottom: calc(max(14px, env(safe-area-inset-bottom)) + 68px);
  right: 14px;
  z-index: 90;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: opacity .4s ease, transform .4s ease;
}
#cat-companion.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
}

/* Cat image wrapper */
.cat-frame {
  width: 72px;
  height: 72px;
  position: relative;
  cursor: pointer;
  filter: drop-shadow(0 4px 12px rgba(120,90,200,.2));
}
.cat-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0; left: 0;
  transition: opacity .4s ease;
  opacity: 0;
  pointer-events: none;
}
.cat-frame img.cat-active {
  opacity: 1;
  pointer-events: auto;
}

/* State-specific animations */
.cat-frame.state-happy img.cat-active   { animation: catHappy 1.2s cubic-bezier(.34,1.56,.64,1) forwards; }
.cat-frame.state-focus img.cat-active   { animation: catFocus 3s ease-in-out infinite; }
.cat-frame.state-idle  img.cat-active   { animation: catIdle  4s ease-in-out infinite; }
.cat-frame.state-neutral img.cat-active { animation: catBob   3s ease-in-out infinite; }

@keyframes catHappy {
  0%   { transform: scale(.6) rotate(-8deg); opacity: 0; }
  40%  { transform: scale(1.15) rotate(4deg); opacity: 1; }
  65%  { transform: scale(.95) rotate(-2deg); }
  80%  { transform: scale(1.05) rotate(1deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes catFocus {
  0%,100% { transform: translateY(0px) scale(1); }
  50%      { transform: translateY(-3px) scale(1.02); }
}
@keyframes catIdle {
  0%,100% { transform: scale(1) rotate(0deg); }
  30%     { transform: scale(.98) rotate(-.5deg); }
  70%     { transform: scale(1.01) rotate(.5deg); }
}
@keyframes catBob {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-4px); }
}

/* Speech bubble */
.cat-bubble { z-index: 91; position: relative;
  background: #fff;
  border: 1.5px solid var(--p);
  border-radius: 12px 12px 12px 2px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 800;
  color: var(--pa);
  white-space: nowrap;
  box-shadow: var(--sh-1);
  animation: bubblePop .3s cubic-bezier(.34,1.56,.64,1);
  max-width: 140px;
  white-space: normal;
  text-align: center;
  line-height: 1.3;
}
@keyframes bubblePop {
  from { opacity: 0; transform: scale(.7) translateY(4px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* Toggle button */
#cat-toggle {
  position: fixed;
  bottom: calc(max(14px, env(safe-area-inset-bottom)) + 62px);
  right: 16px;
  z-index: 89;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--pl);
  border: 1.5px solid var(--p);
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--sh-1);
  transition: all var(--t-base);

}

<script>
// ══════════════════════════════════════════════════════════════════════
// ── CONSTANTS ──────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
const THEMES = {
  lav:  {name:"Lavender", p:"#d4c8f8", pl:"#f0ecff", pd:"#a98be8", pa:"#7c5cbf", nav:"#f0ecff"},
  sky:  {name:"Sky",      p:"#b8d8f8", pl:"#e8f4ff", pd:"#7bbaf0", pa:"#3a8ad4", nav:"#e8f4ff"},

const DEFAULT_HABITS = [

const QUOTES = [

  "Tiny habits, massive results 💥","Be patient with yourself 🌸",
  "Rest is part of the process too 🌙","Consistency is a superpower ⚡",
  "You're doing better than you think 💫","One day at a time 🌿",
];
const MOODS  = [{e:"😞",l:"Bad",v:1},{e:"😐",l:"Meh",v:2},{e:"🙂",l:"Good",v:3},{e:"😊",l:"Great",v:4},{e:"🤩",l:"Amazing",v:5}];
const ENERGY = [{i:"🪫",l:"Low",v:1,c:"#f8c8c8"},{i:"⚡",l:"Medium",v:2,c:"#f8e8b8"},{i:"🚀",l:"High",v:3,c:"#b8f8d0"}];
const BADGES = [
  {id:"b1",i:"🌟",n:"First Step", d:"Complete first habit",  q:s=>s.total>=1},
  {id:"b2",i:"🔥",n:"On Fire",    d:"7-day streak",          q:s=>s.maxStreak>=7},
  {id:"b3",i:"💎",n:"Consistent", d:"50 total completions",  q:s=>s.total>=50},
  {id:"b4",i:"👑",n:"Champion",   d:"30-day streak",         q:s=>s.maxStreak>=30},
  {id:"b5",i:"🌈",n:"Mood Logger",d:"Log mood 5 days",       q:s=>s.moodDays>=5},
  {id:"b6",i:"🎯",n:"Century",    d:"100 completions",       q:s=>s.total>=100},
];
const ICONS = ["⭐","📚","🏃","✨","📖","💛","🌙","🎵","🧘","💧","🎨","🧠","💊","🛁","🌿","🎮","🍎","🏋️","🧩","📝"];
const AVATARS = ["🌸","🌙","⭐","🦋","🌿","🐾","🎯","🦊","🐼","🌊","🧠","🎮"];
const ENERGY_SUGGEST = {
  1:{label:"Low Energy",  icon:"🪫",color:"#f8c8c8",textColor:"#c84040",tasks:["Light reading","Revision","Organize notes","Skincare routine","Gentle walk"],tip:"Keep it light. Review old material, rest."},
  2:{label:"Medium Energy",icon:"⚡",color:"#f8e8b8",textColor:"#c87820",tasks:["Complete homework","Workout","Study familiar topics","Plan tomorrow","Read new chapter"],tip:"Solid focus. Tackle normal tasks."},
  3:{label:"High Energy", icon:"🚀",color:"#c8f8e0",textColor:"#2a9060",tasks:["Deep study session","Hard problems","New concepts","Workout hard","Create/build something"],tip:"Use this peak! Attack the hardest tasks first."},
};
const LEAK_PRESETS = [
  {l:"Scrolling",i:"📱"},{l:"YouTube",i:"▶️"},{l:"Daydreaming",i:"💭"},
  {l:"Overthinking",i:"🌀"},{l:"Gaming",i:"🎮"},{l:"Chatting",i:"💬"},
  {l:"Procrastinating",i:"🐌"},{l:"Other",i:"🕳️"},
];
const PRIO_COLS = {High:["#f8c8c8","#c84040"], Medium:["#f8e8b8","#c87820"], Low:["#c8f8e0","#2a9060"]};

// ══════════════════════════════════════════════════════════════════════
// ── STORAGE ────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
const LS = {
  get: (key, def) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } },
  set: (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
};

// ══════════════════════════════════════════════════════════════════════
// ── STATE ───────────────────────────────────────────────────────────
// FIX 11: single localStorage key = 1 read on boot instead of 12
//         all writes debounced into one 150ms batch = zero blocking I/O
// ══════════════════════════════════════════════════════════════════════
const STORE_KEY = "hb_v2";

// Migrate from old per-key storage (one-time, silent)
function _migrateOldKeys() {
  if (localStorage.getItem(STORE_KEY)) return null;
  const old = {
    profile: LS.get("hb_profile",null), habits: LS.get("hb_habits",null),
    logs:    LS.get("hb_logs",   null), moods:  LS.get("hb_moods", null),
    journal: LS.get("hb_journal",null), tasks:  LS.get("hb_tasks", null),
    theme:   LS.get("hb_theme",  null), pom:    LS.get("hb_pom",   null),
    audits:  LS.get("hb_audits", null), leaks:  LS.get("hb_leaks", null),
    energy:  LS.get("hb_energy", null), rcData: LS.get("hb_rcdata",null),
  };
  return Object.values(old).some(v => v !== null) ? old : null;
}

function _loadState() {
  const saved = _migrateOldKeys() || LS.get(STORE_KEY, {});
  return {
    profile: saved.profile ?? null,
    habits:  saved.habits  ?? DEFAULT_HABITS,
    logs:    saved.logs    ?? {},
    moods:   saved.moods   ?? {},
    journal: saved.journal ?? {},
    tasks:   saved.tasks   ?? [],
    theme:   saved.theme   ?? "lav",
    pom:     saved.pom     ?? {work:25,brk:5,left:25*60,phase:"work",running:false,sessions:0},
    audits:  saved.audits  ?? {},
    leaks:   saved.leaks   ?? {},
    energy:  saved.energy  ?? {},
    rcData:  saved.rcData  ?? {},
    focus:   {active:false,taskId:null,taskName:"",left:0,total:0,running:false},
    earnedBadges: saved.earnedBadges || [],
  };
}

let S = _loadState();

// FIX 11: debounced write — all state changes batch into 1 write per 150ms
let _saveTimer = null;
function _scheduleSave() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => { LS.set(STORE_KEY, S); _saveTimer = null; }, 150);
}

// Centralized state update with debounced persist + cache invalidation
function updateState(key, newVal) {
  S[key] = newVal;
  _scheduleSave();
  if (key === "tasks" || key === "logs") _rcCache = null; // FIX 8: RC cache invalidation
}

// FIX #3: UI transient state object — replaces all window._ globals
const UI = {
  _state: {},
  reset()            { this._state = {}; },
  set(key, val)      { this._state[key] = val; },
  get(key, fallback) { return this._state[key] !== undefined ? this._state[key] : fallback; },
};

let currentTab  = "home";
let pomTimer    = null;
let focusTimer  = null;

// ══════════════════════════════════════════════════════════════════════
// ── UTILS ───────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
// FIX #9: HTML escape — prevents XSS from user-typed content
function esc(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g,  "&amp;")
    .replace(/</g,  "&lt;")
    .replace(/>/g,  "&gt;")
    .replace(/"/g,  "&quot;")
    .replace(/'/g,  "&#039;");
}

// FIX U15: Haptic feedback — physical feel on key actions
function haptic(type = "light") {
  if (!navigator.vibrate) return;
  const patterns = { light:[6], medium:[12], success:[8,40,8] };
  navigator.vibrate(patterns[type] || [6]);
}

// FIX F1: Auto-clean tasks older than 7 days + carry forward incomplete tasks
function cleanAndCarryForwardTasks() {
  const td = today();
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  const cutoffStr = cutoff.toISOString().split("T")[0];
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const ydStr = yesterday.toISOString().split("T")[0];

  const yTasks = S.tasks.filter(t => t.date === ydStr && !t.done);
  const alreadyCarried = new Set(S.tasks.filter(t => t.date === td && t.carriedFrom).map(t => t.carriedFrom));
  const newCarried = yTasks
    .filter(t => !alreadyCarried.has(t.id))
    .map(t => ({ ...t, id: uid(), date: td, done: false, carriedFrom: t.id }));

  const cleaned = S.tasks.filter(t => t.date >= cutoffStr);
  const updated = [...cleaned, ...newCarried];
  if (updated.length !== S.tasks.length || newCarried.length > 0) {
    updateState("tasks", updated);
  }
}

// FIX F6: Smart weekly insight — actual human-readable takeaway
function getWeeklyInsight() {
  const days = weekDates();
  if (!S.habits.length) return "Add habits to start tracking 🌱";
  const habitRates = S.habits.map(h => {
    const done = days.filter(d => S.logs[d]?.[h.id]?.done).length;
    return { name: h.name, icon: h.icon, rate: Math.round(done / 7 * 100) };
  });
  const best   = habitRates.reduce((a,b) => b.rate > a.rate ? b : a, habitRates[0]);
  const worst  = habitRates.reduce((a,b) => b.rate < a.rate ? b : a, habitRates[0]);
  const avg    = Math.round(habitRates.reduce((s,h) => s+h.rate, 0) / habitRates.length);
  const leakW  = days.reduce((s,d) => s + (S.leaks[d]||[]).reduce((a,l)=>a+l.mins,0), 0);
  if (avg >= 80) return `🏆 Incredible week! ${avg}% consistency. ${best.icon} ${esc(best.name)} is your strongest habit`;
  if (avg >= 50) return `💪 Solid at ${avg}%. ${worst.icon} ${esc(worst.name)} needs more attention — try tomorrow`;
  if (leakW > 120) return `⏳ ${leakW}min lost to distractions this week. Cut that in half and watch the difference`;
  return `🌱 ${avg}% this week. Focus on just ${worst.icon} ${esc(worst.name)} — build momentum from there`;
}

const today   = () => new Date().toISOString().split("T")[0];
const uid     = () => Math.random().toString(36).slice(2, 9);
const fmtTime = (secs) => `${String(Math.floor(secs / 60)).padStart(2,"0")}:${String(secs % 60).padStart(2,"0")}`;

function weekDates() {
  const base = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base);
    d.setDate(base.getDate() - i);
    days.push(d.toISOString().split("T")[0]);
  }
  return days;
}

function dayLabel(dateStr) {
  return new Date(dateStr).toLocaleDateString("en", {weekday:"short"});
}

function applyTheme(themeId) {
  const theme = THEMES[themeId] || THEMES.lav;
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty("--p",  theme.p);
  rootStyle.setProperty("--pl", theme.pl);
  rootStyle.setProperty("--pd", theme.pd);
  rootStyle.setProperty("--pa", theme.pa);
  document.querySelector('meta[name="theme-color"]').content = theme.nav;
}

// FIX #7: Unified today values — compute once per page call, pass around
function getTodayContext() {
  const td        = today();
  const todayLog  = S.logs[td]    || {};
  const todayMood = S.moods[td];
  const todayNote = S.journal[td] || "";
  const energyLvl = S.energy[td]  || 0;
  const auditDone = !!S.audits[td];
  const leakMins  = (S.leaks[td]  || []).reduce((sum, lk) => sum + lk.mins, 0);
  return { td, todayLog, todayMood, todayNote, energyLvl, auditDone, leakMins };
}

// FIX #6: Descriptive variable names throughout all computed functions

// ══════════════════════════════════════════════════════════════════════
// ── COMPUTED / CACHE ────────────────────────────────────────────────
// FIX #2: Memoized streak cache — computed once per day, not per render
// ══════════════════════════════════════════════════════════════════════
let _streakCache     = null;
let _streakCacheDate = null;
let _statsCache      = null; // FIX #5: merged stats cache

function invalidateCache() {
  _streakCache = null;
  _statsCache  = null;
}

function getAllStreaks() {
  const todayStr = today();
  if (_streakCache && _streakCacheDate === todayStr) return _streakCache;

  const cache = {};
  S.habits.forEach(habit => {
    let streakCount = 0;
    const baseDate  = new Date();
    for (let daysBack = 0; daysBack < 365; daysBack++) {
      const checkDate = new Date(baseDate);
      checkDate.setDate(baseDate.getDate() - daysBack);
      const dateKey = checkDate.toISOString().split("T")[0];
      if (S.logs[dateKey]?.[habit.id]?.done) streakCount++;
      else break;
    }
    cache[habit.id] = streakCount;
  });

  _streakCache     = cache;
  _streakCacheDate = todayStr;
  return cache;
}

// FIX #5: Single stats computation, reused across Home/Settings/Stats
function getStats() {
  if (_statsCache) return _statsCache;

  const streaks   = getAllStreaks();
  const total     = Object.values(S.logs)
    .flatMap(dayLog => Object.values(dayLog))
    .filter(entry => entry.done).length;
  const maxStreak = S.habits.length ? Math.max(0, ...Object.values(streaks)) : 0;
  const moodDays  = Object.keys(S.moods).length;

  _statsCache = { total, maxStreak, moodDays, streaks };
  return _statsCache;
}

function todayPct() {
  if (!S.habits.length) return 0;
  const { todayLog } = getTodayContext();
  const doneCount = S.habits.filter(h => todayLog[h.id]?.done).length;
  return Math.round(doneCount / S.habits.length * 100);
}

// FIX #8: Targeted DOM patch for habit toggle — avoids full re-render
function toggleHabit(habitId) {
  const td      = today();
  const dayLog  = { ...(S.logs[td] || {}) };
  const isDone  = !dayLog[habitId]?.done;
  dayLog[habitId] = { ...(dayLog[habitId] || {}), done: isDone };
  updateState("logs", { ...S.logs, [td]: dayLog });
  invalidateCache();
  haptic(isDone ? "success" : "light"); // FIX U15: haptic

  // Patch only the touched card — no full re-render
  const card   = document.querySelector(`[data-habit-id="${habitId}"]`);
  const toggle = card?.querySelector(".habit-toggle");
  const nameEl = card?.querySelector(".habit-name");
  if (card && toggle) {
    card.classList.toggle("done", isDone);
    toggle.classList.toggle("done", isDone);
    toggle.innerHTML = isDone
      ? '<span style="font-size:18px">✓</span>'
      : `<span style="font-size:20px">${esc(S.habits.find(h => h.id === habitId)?.icon || "")}</span>`;
    if (nameEl) nameEl.classList.toggle("done", isDone);
    card.querySelector(".habit-done-badge") && (card.querySelector(".habit-done-badge").style.display = isDone ? "" : "none");

    // FIX U9: micro-celebration — card pops on completion
    if (isDone) {
      card.classList.add("just-done");
      setTimeout(() => card.classList.remove("just-done"), 400);
    }

    // Update header count
    const countEl = document.getElementById("habits-count");
    if (countEl) {
      const doneNow = S.habits.filter(h => S.logs[td]?.[h.id]?.done).length;
      countEl.textContent = `${doneNow}/${S.habits.length} done`;
    }
    // Update progress ring
    const pct = todayPct();
    const ringCircle = document.getElementById("home-ring-circle");
    const ringLabel  = document.getElementById("home-ring-label");
    if (ringCircle) {
      const size = 72, stroke = 6, r = (size - stroke*2)/2, circ = 2*Math.PI*r;
      ringCircle.setAttribute("stroke-dashoffset", (circ*(1-pct/100)).toFixed(1));
    }
    if (ringLabel) ringLabel.textContent = pct + "%";
  } else {
    pageHome(); // fallback
  }
}

// ══════════════════════════════════════════════════════════════════════
// ── RENDER ENGINE ───────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
function render(html) {
  // FIX 7: No JS animation delay loop — CSS nth-child stagger handles it
  // Eliminates layout thrash from writing animationDelay in a forEach loop
  document.getElementById("page").innerHTML = html;
}

function switchTab(tabName) {
  currentTab = tabName;
  // FIX F1: check for task carry-forward when switching to planner or home
  if (tabName === "planner" || tabName === "home") cleanAndCarryForwardTasks();
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tabName);
  });
  pages[tabName]();
}

// ══════════════════════════════════════════════════════════════════════
// ── SHARED UI HELPERS ───────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
function showModal(title, content) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">${esc(title)}</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      ${content}
    </div>`;
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function closeModal() {
  const el = document.getElementById("modal-overlay");
  if (el) el.remove();
  UI.reset(); // FIX #3: clean UI state on every modal close
}

function showToast(message, bgColor, textColor) {
  const toast = document.createElement("div");
  toast.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:700;
    background:${bgColor};color:${textColor};border-radius:14px;padding:12px 20px;
    font-size:13px;font-weight:800;box-shadow:0 4px 20px rgba(0,0,0,.15);
    max-width:320px;text-align:center;animation:slideUp .3s ease;`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function showFocusDoneToast(name) {
  showToast(`✅ "${esc(name)}" complete! Great session 🎉`, "var(--pl)", "var(--pa)");
}


// FIX #3: Single avatar grid renderer — replaces selectAvi + selectAvatar duplication
function renderAvatarGrid(containerId, stateKey, currentAvatar) {
  return AVATARS.map(avatar => `
    <button onclick="selectInGrid('${containerId}','${stateKey}','${avatar}')"
      id="${containerId}-${avatar}"
      style="font-size:22px;width:40px;height:40px;border-radius:10px;transition:all .2s;
      background:${currentAvatar===avatar?'var(--p)':'var(--pl)'};
      border:2px solid ${currentAvatar===avatar?'var(--pd)':'transparent'}">
      ${avatar}
    </button>`).join("");
}

function selectInGrid(containerId, stateKey, value) {
  UI.set(stateKey, value);
  document.querySelectorAll(`[id^="${containerId}-"]`).forEach(btn => {
    const isSelected = btn.id === `${containerId}-${value}`;
    btn.style.background   = isSelected ? "var(--p)"   : "var(--pl)";
    btn.style.borderColor  = isSelected ? "var(--pd)"  : "transparent";
  });
}

function progressRingHTML(pct, size, stroke, idPrefix) {
  const r    = (size - stroke*2) / 2;
  const circ = 2 * Math.PI * r;
  const off  = circ * (1 - pct/100);
  return `
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pl)" stroke-width="${stroke}"/>
      <circle id="${idPrefix}-ring-circle" cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
        stroke="var(--pd)" stroke-width="${stroke}"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        stroke-linecap="round" style="transition:stroke-dashoffset .6s ease"/>
    </svg>`;
}

// ══════════════════════════════════════════════════════════════════════
// ── SETUP ───────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
function showSetup() {
  document.getElementById("nav").style.display = "none";
  document.getElementById("page").style.padding = "0";
  document.getElementById("page").innerHTML = `
  <div id="setup">
    <div class="setup-card">
      <h1 style="font-family:'Playfair Display',serif;font-size:28px;text-align:center;margin-bottom:4px">Welcome! ✨</h1>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px">Let's set up your space</p>
      <div class="label">Pick your vibe</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px">
        ${renderAvatarGrid("savi", "setupAvatar", "🌸")}
      </div>
      <input class="inp" id="setup-name" placeholder="Your name *" oninput="checkSetup()"/>
      <input class="inp" id="setup-bio"  placeholder="Short bio (optional)"/>
      <input class="inp" id="setup-goal" placeholder="Your main goal e.g. Study in Japan 🇯🇵" style="margin-bottom:20px"/>
      <button class="btn-primary" id="setup-btn" onclick="doSetup()" disabled

function checkSetup() {
  const name = document.getElementById("setup-name").value.trim();
  const btn  = document.getElementById("setup-btn");
  btn.disabled    = !name;
  btn.style.opacity = name ? "1" : ".5";
}

function doSetup() {
  const name = document.getElementById("setup-name").value.trim();
  if (!name) return;
  updateState("profile", {
    name,
    bio:    document.getElementById("setup-bio").value,
    goal:   document.getElementById("setup-goal").value,
    avatar: UI.get("setupAvatar", "🌸"),
    joined: today(),
  });
  document.getElementById("nav").style.display  = "flex";
  document.getElementById("page").style.padding = "0 16px 96px";
  switchTab("home");
}

// FIX #6: descriptive param names; FIX #4: uses CSS classes not inline styles
function habitCardHTML(habit, log, streak, index) {
  const isDone = log?.done;
  return `
  <div class="habit-card${isDone?' done':''} fade-up" data-habit-id="${habit.id}" style="animation-delay:${index*45}ms">
    <button class="habit-toggle${isDone?' done':''}" onclick="toggleHabit('${habit.id}')">
      ${isDone
        ? '<span style="font-size:18px;animation:checkPop .3s ease">✓</span>'
        : `<span style="font-size:20px">${esc(habit.icon)}</span>`}
    </button>
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="habit-name${isDone?' done':''}">${esc(habit.name)}</span>
        ${streak > 0 ? `<span class="streak"><span class="flame">🔥</span>${streak}</span>` : ""}
      </div>
      <span style="font-size:11px;color:var(--muted);font-weight:600">Target: ${habit.target} ${esc(habit.unit)}</span>
    </div>
    <span class="habit-done-badge" style="font-size:18px;${isDone?'':'display:none'}">🎉</span>
  </div>`;
}

    b.style.background  = x===p ? PRIO_COLS[x][0] : "var(--pl)";

function saveQuickTask() {
  const title = document.getElementById("qt-title")?.value.trim();

function saveJournal() {

  updateState("journal", { ...S.journal, [today()]: text });

}

function openAddHabit()      { habitFormModal(null); }
function openEditHabit(hid)  { habitFormModal(S.habits.find(h => h.id === hid)); }

function habitFormModal(habit) {
  const currentIcon = habit?.icon || "⭐";
  UI.reset();
  UI.set("habitIcon", currentIcon);
  showModal(habit ? "Edit Habit ✏️" : "New Habit ✨", `
    <div class="label">Icon</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${ICONS.map(ic => `
        <button onclick="selectInGrid('hic','habitIcon','${ic}')" id="hic-${ic}"
          style="font-size:20px;width:36px;height:36px;border-radius:9px;transition:all .2s;
          background:${currentIcon===ic?'var(--p)':'var(--pl)'};
          border:1.5px solid ${currentIcon===ic?'var(--pd)':'transparent'}">${ic}</button>
      `).join("")}
    </div>
    <div class="label">Name</div>
    <input class="inp" id="hf-name" value="${esc(habit?.name||'')}" placeholder="Habit name"/>
    <div style="display:flex;gap:10px">
      <div style="flex:1">
        <div class="label">Target</div>
        <input class="inp" id="hf-target" type="number" value="${habit?.target||1}" style="margin-bottom:0"/>
      </div>
      <div style="flex:1">
        <div class="label">Unit</div>
        <input class="inp" id="hf-unit" value="${esc(habit?.unit||'session')}" placeholder="hrs/min/session" style="margin-bottom:0"/>
      </div>
    </div>
    <div style="height:14px"></div>
    <button class="btn-primary" onclick="saveHabit('${habit?.id||''}')"
      style="background:linear-gradient(135deg,var(--pd),var(--pa))">Save Habit ✓</button>
  `);
}

function saveHabit(habitId) {
  const name = document.getElementById("hf-name").value.trim();
  if (!name) return;
  const habitData = {
    icon:   UI.get("habitIcon", "⭐"),
    name,
    target: parseInt(document.getElementById("hf-target").value) || 1,
    unit:   document.getElementById("hf-unit").value || "session",
  };
  if (habitId) {
    updateState("habits", S.habits.map(h => h.id === habitId ? { ...h, ...habitData } : h));
  } else {
    updateState("habits", [...S.habits, { id: uid(), ...habitData }]);
  }
  invalidateCache();
  closeModal();
  pageHabits();
}

function deleteHabit(habitId) {
  if (!confirm("Delete this habit?")) return;
  updateState("habits", S.habits.filter(h => h.id !== habitId));
  invalidateCache();
  pageHabits();
}

      opacity:${task.done?.85:1};transition:opacity .3s">
      <div style="display:flex;align-items:center;gap:10px">
        <button onclick="toggleTask('${task.id}')" style="width:28px;height:28px;border-radius:8px;flex-shrink:0;
          background:${task.done?'var(--pd)':'var(--pl)'};border:2px solid var(--p);font-size:14px;

      <div style="display:flex;gap:7px;margin-top:10px">

function selectTaskPrio(priority) {
  UI.set("taskPrio", priority);
  ["High","Medium","Low"].forEach(p => {
    const btn = document.getElementById("prio-" + p);
    if (!btn) return;
    const isSelected = p === priority;
    btn.style.background  = isSelected ? PRIO_COLS[p][0] : "var(--pl)";
    btn.style.color       = isSelected ? PRIO_COLS[p][1] : "var(--muted)";
    btn.style.borderColor = isSelected ? PRIO_COLS[p][1] : "var(--p)";
  });
}

function saveTask() {
  const title = document.getElementById("tf-title").value.trim();
  if (!title) return;
  const newTask = {
    id:          uid(),
    title,
    time:        document.getElementById("tf-time").value,
    priority:    UI.get("taskPrio", "Medium"),
    plannedMins: parseInt(document.getElementById("tf-planned")?.value) || 0,
    date:        today(),
    done:        false,
  };
  updateState("tasks", [...S.tasks, newTask]);
  closeModal();
  pagePlanner();
}

function toggleTask(taskId) {
  updateState("tasks", S.tasks.map(t => t.id === taskId ? { ...t, done: !t.done } : t));
  pagePlanner();
}

function deleteTask(taskId) {
  updateState("tasks", S.tasks.filter(t => t.id !== taskId));
  pagePlanner();
}

// ── PAGE: TIMER ─────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
function pageTimer() {
  const pm     = S.pom;
  const isWork = pm.phase === "work";
  const total  = isWork ? pm.work*60 : pm.brk*60;
  const pct    = (total - pm.left) / total * 100;
  const size = 200, stroke = 10, r = (size-stroke*2)/2, circ = 2*Math.PI*r, off = circ*(1-pct/100);

  render(`
  <div style="padding-top:20px">
  <h2 class="pg-title fade-up" style="margin-bottom:20px">Focus Timer ⏱️</h2>
  <div style="display:flex;justify-content:center;margin-bottom:28px" class="fade-up">
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pl)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
          stroke="${isWork?'var(--pd)':'#58c890'}" stroke-width="${stroke}"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
          stroke-linecap="round" style="transition:stroke-dashoffset 1.05s linear" id="pom-arc"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span id="pom-time" style="font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text)">${fmtTime(pm.left)}</span>
        <span id="pom-phase" style="font-size:12px;font-weight:800;color:${isWork?'var(--pa)':'#1ea86a'};text-transform:uppercase;letter-spacing:1px">${isWork?"Focus":"Break"}</span>
        <span style="font-size:11px;color:var(--muted);font-weight:600;margin-top:3px">Session ${pm.sessions+1}</span>
      </div>
    </div>

    <button onclick="pomReset()" style="width:52px;height:52px;border-radius:var(--r-sm);background:var(--pl);border:1.5px solid var(--p);font-size:20px;transition:all var(--t-base)">↺</button>
    <button onclick="pomToggle()" style="width:68px;height:68px;border-radius:20px;font-size:24px;

    <button onclick="pomSkip()" style="width:52px;height:52px;border-radius:var(--r-sm);background:var(--pl);border:1.5px solid var(--p);font-size:20px;transition:all var(--t-base)">⏭</button>
  </div>

      </div>
      <div style="flex:1">

    </div>` : ""}
  </div>`);
}

// FIX #10: pom state persisted after every significant change
let _pomSaveThrottle = null;
function pomSave(force = false) {
  if (force) { clearTimeout(_pomSaveThrottle); LS.set("hb_pom", S.pom); _pomSaveThrottle = null; return; }
  if (_pomSaveThrottle) return;
  _pomSaveThrottle = setTimeout(() => { LS.set("hb_pom", S.pom); _pomSaveThrottle = null; }, 30000);
}

// FIX TIMER-BLINK: surgical DOM patch — only updates text+arc, never rebuilds page
function _patchTimerDOM() {
  const pm = S.pom;
  const timeEl  = document.getElementById("pom-time");
  const arcEl   = document.getElementById("pom-arc");
  if (!timeEl) return; // not on timer tab — skip

  timeEl.textContent = fmtTime(pm.left);

  if (arcEl) {
    const isWork = pm.phase === "work";
    const total  = isWork ? pm.work*60 : pm.brk*60;
    const size = 200, stroke = 10, r = (size-stroke*2)/2, circ = 2*Math.PI*r;
    arcEl.style.strokeDashoffset = (circ * (1 - (total - pm.left) / total)).toFixed(1);
  }
}

function pomToggle() {
  S.pom.running = !S.pom.running;
  haptic("light");
  if (S.pom.running) {
    clearInterval(pomTimer);
    pomTimer = setInterval(() => {
      S.pom.left--;
      pomSave(); // throttled — max once per 30s

      if (S.pom.left <= 0) {
        clearInterval(pomTimer);
        const wasWork  = S.pom.phase === "work";
        S.pom.phase    = wasWork ? "break" : "work";
        S.pom.left     = wasWork ? S.pom.brk*60 : S.pom.work*60;
        if (wasWork) S.pom.sessions++;
        S.pom.running  = false;
        pomSave(true); // force write on phase change
        haptic("success");
        if (currentTab === "timer") pageTimer(); // full rebuild only on phase change
        return;
      }
      // BLINK FIX: patch only time text + arc — no innerHTML rebuild
      _patchTimerDOM();
    }, 1000);
  } else {
    clearInterval(pomTimer);
    pomSave(true);
  }
  // Full rebuild only for play/pause button state change
  if (currentTab === "timer") pageTimer();
}

function pomReset() {
  clearInterval(pomTimer);
  S.pom = { ...S.pom, running:false, left:S.pom.work*60, phase:"work" };
  pomSave();
  if (currentTab === "timer") pageTimer();
}

function pomSkip() {
  clearInterval(pomTimer);
  const wasWork  = S.pom.phase === "work";
  S.pom.phase    = wasWork ? "break" : "work";
  S.pom.left     = wasWork ? S.pom.brk*60 : S.pom.work*60;
  S.pom.running  = false;
  pomSave();
  if (currentTab === "timer") pageTimer();
}

function pomSetWork(v) {
  S.pom.work = parseInt(v) || 25;
  if (!S.pom.running) { S.pom.left = S.pom.work*60; S.pom.phase = "work"; }
  pomSave();
}
function pomSetBrk(v) { S.pom.brk = parseInt(v) || 5; pomSave(); }

// ── SYSTEM 1: FOCUS LOCK ────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
function startFocusSession(taskId, taskName, mins) {
  clearInterval(focusTimer);
  const totalSecs = mins * 60;
  S.focus = { active:true, taskId, taskName, left:totalSecs, total:totalSecs, running:true };
  document.getElementById("nav").classList.add("locked");
  renderFocusOverlay();

  const rcDay = { ...(S.rcData[today()] || {}) };
  if (!rcDay[taskId]) rcDay[taskId] = { planned: mins, actual: 0 };
  updateState("rcdata", { ...S.rcData, [today()]: rcDay });

  focusTimer = setInterval(() => {
    S.focus.left--;
    if (S.focus.left <= 0) {
      clearInterval(focusTimer);
      S.focus.running = false;
      S.focus.active  = false;
      updateState("tasks", S.tasks.map(t => t.id===taskId ? {...t, done:true, actualMins:mins} : t));
      const rcD = { ...(S.rcData[today()] || {}) };
      if (rcD[taskId]) rcD[taskId].actual = mins;
      updateState("rcdata", { ...S.rcData, [today()]: rcD });
      document.getElementById("nav").classList.remove("locked");
      removeFocusOverlay();
      showToast(`✅ "${esc(taskName)}" complete! Great session 🎉`, "var(--pl)", "var(--pa)");
      if (currentTab === "planner") pagePlanner();
      return;
    }
    updateFocusTimer();
  }, 1000);
}

function renderFocusOverlay() {
  removeFocusOverlay();
  const f = S.focus;
  const size = 200, stroke = 10, r = (size-stroke*2)/2, circ = 2*Math.PI*r;
  const off  = circ * (1 - (f.total-f.left)/f.total);
  const el   = document.createElement("div");
  el.id      = "focus-lock-overlay";
  el.innerHTML = `
    <p style="font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px">🔒 Focus Mode</p>
    <div class="focus-ring-wrap">
      <svg width="${size}" height="${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pl)" stroke-width="${stroke}"/>
        <circle id="fl-arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pd)"
          stroke-width="${stroke}" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
          stroke-linecap="round" style="transition:stroke-dashoffset .8s ease;transform:rotate(-90deg);transform-origin:center"/>
      </svg>
      <div class="focus-ring-label">
        <span id="fl-time" style="font-size:40px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums">${fmtTime(f.left)}</span>
        <span style="font-size:11px;font-weight:800;color:var(--pa);text-transform:uppercase;letter-spacing:1px">Remaining</span>
      </div>
    </div>
    <div class="focus-task-name">${esc(f.taskName)}</div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:20px">Stay locked in. You got this 💪</div>
    <div style="display:flex;gap:14px;margin-bottom:28px">
      <button onclick="pauseResumeFocus()" id="fl-pause" style="width:60px;height:60px;border-radius:18px;font-size:22px;
        background:linear-gradient(135deg,var(--pl),var(--pd));border:2px solid var(--p);
        box-shadow:var(--sh-3);transition:all var(--t-base);animation:focusPulse 2s infinite">⏸</button>
    </div>
    <button onclick="attemptExitFocus()" class="focus-exit-btn">Exit Early</button>
    <p style="font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;text-align:center">Nav is locked until session ends</p>
  `;
  document.body.appendChild(el);
}

function updateFocusTimer() {
  const f   = S.focus;
  const el  = document.getElementById("fl-time");
  const arc = document.getElementById("fl-arc");
  if (el)  el.textContent = fmtTime(f.left);
  if (arc) {
    const size = 200, stroke = 10, r = (size-stroke*2)/2, circ = 2*Math.PI*r;
    arc.style.strokeDashoffset = circ * (1 - (f.total-f.left)/f.total);
  }
}

function pauseResumeFocus() {
  S.focus.running = !S.focus.running;
  if (S.focus.running) {
    clearInterval(focusTimer);
    focusTimer = setInterval(() => {
      S.focus.left--;
      if (S.focus.left <= 0) {
        clearInterval(focusTimer);
        S.focus.running = false;
        S.focus.active  = false;
        document.getElementById("nav").classList.remove("locked");
        removeFocusOverlay();
        updateState("tasks", S.tasks.map(t => t.id===S.focus.taskId ? {...t,done:true} : t));
        showFocusDoneToast(S.focus.taskName);
        if (currentTab === "planner") pagePlanner();
        return;
      }
      updateFocusTimer();
    }, 1000);
  } else {
    clearInterval(focusTimer);
  }
  const btn = document.getElementById("fl-pause");
  if (btn) btn.textContent = S.focus.running ? "⏸" : "▶";
}

function attemptExitFocus() {
  const warn = document.createElement("div");
  warn.id = "focus-warn";
  warn.style.cssText = "position:fixed;inset:0;z-index:600;background:rgba(50,40,80,.5);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)";
  warn.innerHTML = `
    <div style="background:#fff;border-radius:24px;padding:24px 20px;max-width:320px;text-align:center;box-shadow:var(--sh-3)">
      <p style="font-size:28px;margin-bottom:10px">⚠️</p>
      <p style="font-weight:900;font-size:16px;margin-bottom:8px">Exit Focus?</p>
      <p style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:20px;line-height:1.5">
        Leaving early marks this session as incomplete and logs wasted time.
      </p>
      <div style="display:flex;gap:10px">
        <button onclick="document.getElementById('focus-warn').remove()"
          style="flex:1;padding:11px;border-radius:12px;background:var(--pl);border:1.5px solid var(--p);font-weight:800;font-size:13px;cursor:pointer">Stay 💪</button>
        <button onclick="exitFocusEarly()"
          style="flex:1;padding:11px;border-radius:12px;background:#f8c8c8;border:1.5px solid #f0a0a0;font-weight:800;font-size:13px;color:#c84040;cursor:pointer">Exit</button>
      </div>
    </div>`;
  document.body.appendChild(warn);
}

function exitFocusEarly() {
  clearInterval(focusTimer);
  const wastedMins = Math.round((S.focus.total - S.focus.left) / 60);
  if (wastedMins > 0) {
    const leaks = { ...S.leaks };
    leaks[today()] = [...(leaks[today()] || []), { label:"Abandoned: " + S.focus.taskName, mins:wastedMins, id:uid() }];
    updateState("leaks", leaks);
  }
  S.focus.active  = false;
  S.focus.running = false;
  document.getElementById("nav").classList.remove("locked");
  ["focus-lock-overlay","focus-warn"].forEach(id => { const e=document.getElementById(id); if(e)e.remove(); });
  showToast("Session exited early. Stay consistent next time 🌱", "#f8e8b8", "#c87820");
  if (currentTab === "planner") pagePlanner();
}

function removeFocusOverlay() {
  const el = document.getElementById("focus-lock-overlay");
  if (el) el.remove();
}

function openFocusPicker(taskId, taskName) {
  UI.reset();
  UI.set("focusMins", 25);
  showModal(`🔒 Focus: ${esc(taskName)}`, `
    <p style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px;line-height:1.5">
      Set duration. Nav locks until you finish.
    </p>
    <div class="label">Duration (minutes)</div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      ${[15,25,30,45,60].map(m => `
        <button onclick="selectFocusMins(${m})" id="fm-${m}"
          style="padding:9px 14px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;
          background:${m===25?'var(--p)':'var(--pl)'};border:1.5px solid ${m===25?'var(--pd)':'var(--p)'};transition:all .2s">
          ${m}m
        </button>`).join("")}
    </div>
    <input type="number" class="inp" id="focus-custom-mins" placeholder="Or type custom minutes" min="1" max="180"/>
    <button class="btn-primary" onclick="launchFocus('${taskId}','${esc(taskName)}')"
      style="background:linear-gradient(135deg,var(--pd),var(--pa))">🔒 Start Focus Session</button>
  `);
  selectFocusMins(25);
}

function selectFocusMins(mins) {
  UI.set("focusMins", mins);
  [15,25,30,45,60].forEach(m => {
    const btn = document.getElementById("fm-" + m);
    if (!btn) return;
    btn.style.background  = m===mins ? "var(--p)"  : "var(--pl)";
    btn.style.borderColor = m===mins ? "var(--pd)" : "var(--p)";
  });
}

function launchFocus(taskId, taskName) {
  const customMins = parseInt(document.getElementById("focus-custom-mins")?.value) || 0;
  const mins       = customMins > 0 ? customMins : UI.get("focusMins", 25);
  closeModal();
  startFocusSession(taskId, taskName, mins);
}

// ── SYSTEM 2: REALITY CHECK ─────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
// FIX: accepts pre-computed days array — no redundant weekDates() calls
function getRealityDataForDays(days) {
  return days.map(d => {
    const dayTasks  = S.tasks.filter(t => t.date === d);
    const planned   = dayTasks.filter(t => t.time || t.plannedMins).length;
    const completed = dayTasks.filter(t => t.done).length;
    const pct       = planned ? Math.round(completed / planned * 100) : 0;
    return { d, label: dayLabel(d), planned, completed, pct };
  });
}

function getRealityData() {
  return getRealityDataForDays(weekDates());
}

function getRCInsight() {
  const data = getRealityData();
  const withPlans = data.filter(d => d.planned > 0);
  if (!withPlans.length) return "Start adding tasks to track your reality gap! 📋";
  const avg = withPlans.reduce((s, d) => s + d.pct, 0) / withPlans.length;
  if (avg >= 85) return `Crushing it — ${Math.round(avg)}% completion this week! 🎯`;
  if (avg >= 60) return `Good progress! ${Math.round(avg)}% completion. A few gaps to close 📈`;
  if (avg >= 30) return `${Math.round(avg)}% done. Try setting smaller, achievable goals 🌱`;
  return `Only ${Math.round(avg)}% complete. Be honest: are your plans realistic? 🤔`;
}

        <button onclick="selectLeakPreset('${preset.l}')" id="lk-${preset.l.replace(/\s/g,'-')}"
          style="padding:7px 12px;border-radius:11px;font-size:12px;font-weight:800;

          ${preset.i} ${preset.l}
        </button>`).join("")}
    </div>
    <input class="inp" id="leak-custom" placeholder="Or type custom activity"/>
    <div class="label">Time wasted (minutes)</div>

      style="background:linear-gradient(135deg,#f8d4b8,#f0a878);color:#6a3a10;margin-bottom:14px">

    ${todayLeaks.length > 0 ? `
      <div style="border-top:1.5px solid var(--p);padding-top:14px">
        <p style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px">TODAY — ${totalMins} min lost</p>
        ${todayLeaks.map(lk => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;
            border-bottom:1px solid var(--pl);font-size:13px">
            <span style="font-weight:700">${esc(lk.label)}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-weight:800;color:#c87820">${lk.mins}m</span>
              <button onclick="removeLeak('${lk.id}')"
                style="font-size:13px;color:#c84040;padding:2px 6px;border-radius:7px;background:#fff5f5;cursor:pointer">✕</button>
            </div>
          </div>`).join("")}
      </div>` : ""}
  `);
}

function selectLeakPreset(label) {
  UI.set("leakLabel", label);
  LEAK_PRESETS.forEach(p => {
    const btn = document.getElementById("lk-" + p.l.replace(/\s/g, "-"));
    if (!btn) return;
    const isSelected = p.l === label;
    btn.style.background  = isSelected ? "var(--p)"  : "var(--pl)";
    btn.style.borderColor = isSelected ? "var(--pd)" : "var(--p)";
  });
  const ci = document.getElementById("leak-custom");
  if (ci) ci.value = "";
}

function saveLeakEntry() {
  const customLabel = document.getElementById("leak-custom")?.value.trim();
  const label       = customLabel || UI.get("leakLabel", "Distraction");
  const mins        = parseInt(document.getElementById("leak-mins")?.value) || 15;
  const leaks       = { ...S.leaks };
  leaks[today()]    = [...(leaks[today()] || []), { label, mins, id: uid() }];
  updateState("leaks", leaks);
  closeModal();
  openLeakLogger();
}

function removeLeak(leakId) {
  const leaks    = { ...S.leaks };
  leaks[today()] = (leaks[today()] || []).filter(lk => lk.id !== leakId);
  updateState("leaks", leaks);
  closeModal();
  openLeakLogger();
}

  const current = S.energy[today()] || null;
  showModal("⚡ Today's Energy Level", `
    <p style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px">
      How charged are you? This helps suggest the right tasks.
    </p>
    ${[1,2,3].map(level => {
      const es = ENERGY_SUGGEST[level];
      return `
      <button onclick="setTodayEnergy(${level})" style="width:100%;padding:14px 16px;border-radius:16px;
        background:${current===level?es.color:'#fff'};border:1.5px solid ${current===level?es.textColor:'var(--p)'};
        margin-bottom:10px;text-align:left;cursor:pointer;transition:all .2s;display:block">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <span style="font-size:22px">${es.icon}</span>
          <span style="font-weight:900;font-size:15px;color:${es.textColor}">${es.label}</span>
          ${current===level ? `<span style="font-size:11px;font-weight:800;color:${es.textColor};margin-left:auto">Selected ✓</span>` : ""}
        </div>
        <p style="font-size:12px;color:var(--muted);font-weight:600;padding-left:32px">${esc(es.tip)}</p>
      </button>`;
    }).join("")}
  `);
}

// ── PAGE MAP & BOOT ─────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
const pages = {
  home:     pageHome,
  habits:   pageHabits,
  planner:  pagePlanner,
  timer:    pageTimer,
  stats:    pageStats,
  settings: pageSettings,
};

applyTheme(S.theme);
cleanAndCarryForwardTasks(); // FIX F1: carry forward incomplete tasks from yesterday
if (!S.profile) {
  showSetup();
} else {
  switchTab("home");
}

// ══════════════════════════════════════════════════════════════════════
// ── CAT COMPANION SYSTEM ───────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
const CAT_STATES = {
  happy:   { img: 'happy',   cls: 'state-happy',   bubbles: ['You did it! 🎉','Yes!! 🥳','Purrfect! ✨','Amazing!! 🌟'] },
  focus:   { img: 'reading', cls: 'state-focus',   bubbles: ['Stay focused 📖','You got this 💪','Deep work mode 🎯','No distractions!'] },
  idle:    { img: 'sleeping',cls: 'state-idle',     bubbles: ['Zzz... 💤','Rest time 🌙','Taking a nap 😴','Sweet dreams~'] },
  neutral: { img: 'neutral', cls: 'state-neutral',  bubbles: ['Hi there! 👋','Ready to go? ⚡','Let\'s do this! 🌸','Meow~ 🐱'] },
};

let _catState    = 'neutral';
let _catVisible  = LS.get('hb_cat_visible', true);
let _catBubbleTimer = null;
let _catHappyTimer  = null;
let _reduceMotion   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function catInit() {
  const el = document.getElementById('cat-companion');
  if (!el) return;
  if (!_catVisible) el.classList.add('hidden');
  catSetState('neutral', false);

  // Tap cat → show bubble
  document.getElementById('cat-frame')?.addEventListener('click', () => {
    catShowBubble();
    haptic('light');
  });

  // Long press → toggle visibility option
  let pressTimer;
  document.getElementById('cat-frame')?.addEventListener('pointerdown', () => {
    pressTimer = setTimeout(() => catShowToggleMenu(), 600);
  });
  document.getElementById('cat-frame')?.addEventListener('pointerup',   () => clearTimeout(pressTimer));
  document.getElementById('cat-frame')?.addEventListener('pointerleave',() => clearTimeout(pressTimer));
}

function catSetState(state, showBubble = true) {
  if (_reduceMotion && state === _catState) return;
  const cfg    = CAT_STATES[state] || CAT_STATES.neutral;
  const frame  = document.getElementById('cat-frame');
  if (!frame) return;

  // Swap active image
  frame.querySelectorAll('img').forEach(img => img.classList.remove('cat-active'));
  const activeImg = document.getElementById('cat-img-' + cfg.img);
  if (activeImg) activeImg.classList.add('cat-active');

  // Swap state class
  frame.className = 'cat-frame ' + cfg.cls;

  _catState = state;
  if (showBubble) catShowBubble(state);
}

function catShowBubble(state) {
  const cfg    = CAT_STATES[state || _catState] || CAT_STATES.neutral;
  const bubble = document.getElementById('cat-bubble');
  if (!bubble) return;

  clearTimeout(_catBubbleTimer);
  const msg = cfg.bubbles[Math.floor(Math.random() * cfg.bubbles.length)];
  bubble.textContent = msg;
  bubble.style.display = 'block';
  bubble.style.animation = 'none';
  void bubble.offsetWidth; // reflow
  bubble.style.animation = '';

  _catBubbleTimer = setTimeout(() => {
    bubble.style.display = 'none';
  }, 2800);
}

function catShowToggleMenu() {
  haptic('medium');
  var visBg    = _catVisible ? '#fff5f5' : 'var(--pl)';
  var visBdr   = _catVisible ? '#f8c8c8' : 'var(--p)';
  var visColor = _catVisible ? '#c84040' : 'var(--pa)';
  var visLabel = _catVisible ? '🙈  Hide Cat' : '😸  Show Cat';
  var motBg    = _reduceMotion ? 'var(--pl)' : '#fff';
  var motBdr   = _reduceMotion ? 'var(--pd)' : 'var(--p)';
  var motLabel = _reduceMotion ? '✨  Animations On' : '🍃  Reduce Motion';
  var catEmoji = _catState==='happy'?'😸':_catState==='focus'?'🤓':_catState==='idle'?'😴':'🐱';
  showModal('🐱 Cat Companion',
    '<p style="font-size:var(--text-sm);color:var(--muted);font-weight:600;margin-bottom:18px;line-height:1.5">' +
      'Your little study buddy! Tap for encouragement.' +
    '</p>' +
    '<div style="display:flex;flex-direction:column;gap:10px">' +
      '<button onclick="catToggleVisible()" style="padding:13px 16px;border-radius:var(--r-md);' +
        'background:' + visBg + ';border:1.5px solid ' + visBdr + ';' +
        'font-weight:800;font-size:var(--text-sm);color:' + visColor + ';' +
        'text-align:left;cursor:pointer;transition:all var(--t-base)">' +
        visLabel +
      '</button>' +
      '<button onclick="catToggleMotion()" style="padding:13px 16px;border-radius:var(--r-md);' +
        'background:' + motBg + ';border:1.5px solid ' + motBdr + ';' +
        'font-weight:800;font-size:var(--text-sm);color:var(--text);' +
        'text-align:left;cursor:pointer;transition:all var(--t-base)">' +
        motLabel +
      '</button>' +
    '</div>' +
    '<div style="margin-top:20px;text-align:center">' +
      '<div style="font-size:64px">' + catEmoji + '</div>' +
      '<p style="font-size:var(--text-xs);color:var(--muted);font-weight:700;margin-top:6px">' +
        'Currently: ' + _catState + ' mode' +
      '</p>' +
    '</div>'
  );
}

function catToggleVisible() {
  _catVisible = !_catVisible;
  LS.set('hb_cat_visible', _catVisible);
  const el = document.getElementById('cat-companion');
  if (el) el.classList.toggle('hidden', !_catVisible);
  closeModal();
  showToast(_catVisible ? '😸 Cat is back!' : '🙈 Cat hidden (long-press to bring back)', 'var(--pl)', 'var(--pa)');
}

function catToggleMotion() {
  _reduceMotion = !_reduceMotion;
  closeModal();
  catShowToggleMenu();
}

// ── Hook cat into app events ────────────────────────────────────────

// Habit checked → happy cat briefly
const _origToggleHabit = toggleHabit;
// Wrap toggleHabit to trigger cat
function toggleHabitWithCat(habitId) {
  const td     = today();
  const wasDone = S.logs[td]?.[habitId]?.done;
  _origToggleHabit(habitId);
  if (!wasDone) {
    // Completing a habit
    clearTimeout(_catHappyTimer);
    catSetState('happy', true);
    _catHappyTimer = setTimeout(() => catSetState('neutral', false), 3500);
  }
}

// Override toggleHabit globally
window._origToggleHabit = toggleHabit;
toggleHabit = toggleHabitWithCat;

// Focus session → reading cat
const _origStartFocus = startFocusSession;
startFocusSession = function(taskId, taskName, mins) {
  catSetState('focus', true);
  _origStartFocus(taskId, taskName, mins);
};

// Focus session end → happy cat
const _origShowFocusDoneToast = showFocusDoneToast;
showFocusDoneToast = function(name) {
  catSetState('happy', true);
  clearTimeout(_catHappyTimer);
  _catHappyTimer = setTimeout(() => catSetState('neutral', false), 4000);
  _origShowFocusDoneToast(name);
};

// Focus exit early → idle/sad cat
const _origExitFocusEarly = exitFocusEarly;
exitFocusEarly = function() {
  catSetState('idle', true);
  clearTimeout(_catHappyTimer);
  _catHappyTimer = setTimeout(() => catSetState('neutral', false), 3000);
  _origExitFocusEarly();
};

// Tab switches → context-aware cat state
const _origSwitchTab = switchTab;
switchTab = function(tabName) {
  _origSwitchTab(tabName);
  if      (tabName === 'timer')   catSetState('focus',   false);
  else if (tabName === 'home')    catSetState('neutral',  false);
  else if (tabName === 'stats')   catSetState('idle',    false);
  else                            catSetState('neutral',  false);
};

// Audit saved → happy cat
const _origSaveAudit = saveAudit;
saveAudit = function() {
  _origSaveAudit();
  catSetState('happy', true);
  clearTimeout(_catHappyTimer);
  _catHappyTimer = setTimeout(() => catSetState('neutral', false), 3500);
};

// Pomodoro phase complete → happy cat
const _origPomToggle = pomToggle;
pomToggle = function() {
  _origPomToggle();
};

// Init cat after DOM loads
document.addEventListener('DOMContentLoaded', catInit);
setTimeout(catInit, 300); // fallback — ensure all overrides loaded

</script>
